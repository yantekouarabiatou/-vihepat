services:
  mysql:
    image: mysql:8.0
    container_name: vihepat-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: vihepat
      MYSQL_USER: vihepat
      MYSQL_PASSWORD: vihepatpass
    ports:
      - "3309:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: vihepat-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  api:
    build: ./backend
    container_name: vihepat-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: vihepat
      DB_USER: vihepat
      DB_PASS: vihepatpass
      JWT_SECRET: ${JWT_SECRET:-change_me_chaine_longue_32_caracteres_minimum}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_autre_chaine_longue_32_caracteres}
      CORS_ORIGIN: http://localhost:8081
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    # Première mise en route : `docker compose exec api npm run db:migrate`
    # puis `docker compose exec api npm run db:seed`.

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: vihepat-web
    restart: unless-stopped
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  mysql_data: