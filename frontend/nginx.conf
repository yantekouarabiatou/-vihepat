server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fichiers statiques existants servis tels quels (assets, icônes, sw.js,
    # manifest.webmanifest) ; sinon on retombe sur index.html pour que le
    # routing côté client (react-router-dom) gère l'URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Le service worker ne doit jamais être mis en cache par le navigateur,
    # sinon une mise à jour de l'app ne serait jamais détectée.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
